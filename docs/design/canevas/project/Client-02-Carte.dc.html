<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>Client, carte et destination</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;1,800&amp;family=Nunito:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Nunito,"Segoe UI",system-ui,sans-serif;background:#F4F7FB;color:#2C3A4A}
button,input{font-family:inherit}
[style*="font-weight: 800"],[style*="font-weight: 700"],h1,h2{font-family:Montserrat,"Segoe UI",system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #2C3A4A; overflow: hidden;">

<div style="position: relative; height: 368px; flex-shrink: 0;">
<svg viewBox="0 0 390 368" width="390" height="368" aria-hidden="true" style="display: block;">
<rect width="390" height="368" fill="#E8EEF6"></rect>
<path d="M-10 300 C70 270 130 330 230 312 S350 260 400 280 V380 H-10Z" fill="#CFE3F7"></path>
<rect x="236" y="70" width="112" height="84" rx="10" fill="#D5EBD9"></rect>
<g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none">
<path d="M-10 130 H400"></path><path d="M-10 236 H400"></path><path d="M74 -10 V300"></path><path d="M196 -10 V320"></path><path d="M318 -10 V280"></path><path d="M-10 30 L400 250"></path>
</g>
<g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none">
<path d="M-10 78 H400"></path><path d="M-10 184 H400"></path><path d="M134 -10 V300"></path><path d="M258 -10 V300"></path>
</g>
<circle cx="196" cy="184" r="34" fill="#1485E0" fill-opacity="0.16"></circle>
<circle cx="196" cy="184" r="10" fill="#0B5FB5" stroke="#FFFFFF" stroke-width="4"></circle>
</svg>
<button type="button" aria-label="Menu" style="position: absolute; left: 16px; top: 56px; width: 48px; height: 48px; border: 0; border-radius: 24px; background: #FFFFFF; box-shadow: 0 2px 10px rgba(10,27,51,0.18); display: flex; align-items: center; justify-content: center;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2C3A4A" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
</button>
<div style="position: absolute; left: 50%; top: 116px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: #2C3A4A; color: #FFFFFF; font-size: 14px; font-weight: 600; white-space: nowrap;">Rue Sherbrooke Ouest</div>
</div>

<div style="flex-grow: 1; margin-top: -20px; border-radius: 22px 22px 0 0; background: #FFFFFF; box-shadow: 0 -6px 20px rgba(10,27,51,0.10); padding: 12px 20px 0 20px; display: flex; flex-direction: column; gap: 14px; position: relative;">
<div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #DCE3EC;"></div>
<div style="font-size: 30px; font-weight: 800; letter-spacing: -0.5px;">Où allez-vous ?</div>

<div style="display: flex; gap: 8px;">
<div style="flex-grow: 1; height: 56px; box-sizing: border-box; border-radius: 14px; background: #F4F7FB; border: 1px solid #DCE3EC; display: flex; align-items: center; gap: 10px; padding: 0 14px;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A5A70" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg>
<label for="dest" style="position: absolute; left: -9999px;">Destination</label>
<input id="dest" type="text" placeholder="Saisir une destination" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; font-size: 17px; color: #2C3A4A; outline: none;">
</div>
<button type="button" style="height: 56px; padding: 0 14px; border: 1.5px solid #0B5FB5; border-radius: 14px; background: #FFFFFF; color: #0B5FB5; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B5FB5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"></path></svg>
Planifier
</button>
</div>

<div style="display: flex; flex-direction: column;">
<sc-for list="{{places}}" as="p" hint-placeholder-count="3">
<button type="button" style="height: 64px; border: 0; border-bottom: 1px solid #EEF2F7; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; padding: 0;">
<div style="width: 40px; height: 40px; border-radius: 20px; background: #E3F1FC; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B5FB5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 16px; font-weight: 600; color: #2C3A4A;">{{p.title}}</div>
<div style="font-size: 14px; color: #4A5A70; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.sub}}</div>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5A70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</sc-for>
</div>
</div>

<div style="height: 76px; flex-shrink: 0; border-top: 1px solid #DCE3EC; background: #FFFFFF; display: flex; align-items: stretch; padding: 0 6px;">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button type="button" style="flex: 1 1 0; min-width: 0; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.color}};">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span style="font-size: 12px; font-weight: {{t.weight}};">{{t.label}}</span>
</button>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

return {

{ title: 'Travail', sub: 'Ajouter votre adresse', icon: 'M4 8h16v12H4zM9 8V5h6v3' },
{ title: 'Aéroport Montréal-Trudeau (YUL)', sub: 'Forfait aéroport, prix total affiché', icon: 'M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z' }
],
tabs: [

{ label: 'Réservations', color: off, weight: 500, icon: 'M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z' },
{ label: 'Historique', color: off, weight: 500, icon: 'M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z' },
{ label: 'Assistance', color: off, weight: 500, icon: 'M4 5h16v11H9l-5 4z' },
{ label: 'Profil', color: off, weight: 500, icon: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0' }
]
};
}
}
</script>
</body>
</html>
