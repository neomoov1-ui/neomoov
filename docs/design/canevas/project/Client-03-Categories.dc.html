<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>Client, choix de la catégorie et prix</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#F4F7FB;color:#0A1B33}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #0A1B33; overflow: hidden;">

<div style="position: relative; height: 178px; flex-shrink: 0;">
<svg viewBox="0 0 390 178" width="390" height="178" aria-hidden="true" style="display: block;">
<rect width="390" height="178" fill="#E8EEF6"></rect>
<rect x="250" y="20" width="100" height="60" rx="10" fill="#D5EBD9"></rect>
<g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none">
<path d="M-10 60 H400"></path><path d="M-10 140 H400"></path><path d="M80 -10 V190"></path><path d="M210 -10 V190"></path><path d="M330 -10 V190"></path>
</g>
<path d="M80 140 H210 V60 H330" stroke="#0B3D91" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"></path>
<circle cx="80" cy="140" r="9" fill="#3DBE6B" stroke="#FFFFFF" stroke-width="3"></circle>
<rect x="321" y="51" width="18" height="18" rx="4" fill="#C62828" stroke="#FFFFFF" stroke-width="3"></rect>
</svg>
<button type="button" aria-label="Retour" style="position: absolute; left: 16px; top: 56px; width: 48px; height: 48px; border: 0; border-radius: 24px; background: #FFFFFF; box-shadow: 0 2px 10px rgba(10,27,51,0.18); display: flex; align-items: center; justify-content: center;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A1B33" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</button>
<div style="position: absolute; right: 16px; top: 62px; padding: 8px 12px; border-radius: 999px; background: #0A1B33; color: #FFFFFF; font-size: 14px; font-weight: 600;">8 km · 18 min</div>
</div>

<div style="flex-grow: 1; margin-top: -18px; border-radius: 22px 22px 0 0; background: #FFFFFF; box-shadow: 0 -6px 20px rgba(10,27,51,0.10); padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 10px; position: relative;">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px;">
<div style="font-size: 22px; font-weight: 800; letter-spacing: -0.3px;">Choisissez votre véhicule</div>
<div style="font-size: 14px; color: #4A5A70;">Prix fixe, tout compris. Aucune majoration de pointe.</div>
</div>

<sc-for list="{{cats}}" as="c" hint-placeholder-count="3">
<button type="button" style="box-sizing: border-box; min-height: 66px; border: {{c.border}}; border-radius: 16px; background: {{c.bg}}; display: flex; align-items: center; gap: 12px; padding: 10px 14px; text-align: left;">
<div style="width: 56px; height: 40px; border-radius: 10px; background: #E4EEFB; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
<svg width="34" height="22" viewBox="0 0 34 22" fill="none" stroke="#0B3D91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15v-3l4-2 4-6h11l5 6 4 1v4h-3M10 15h13"></path><circle cx="8" cy="16" r="3"></circle><circle cx="26" cy="16" r="3"></circle></svg>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
<div style="display: flex; align-items: center; gap: 8px;">
<span style="font-size: 17px; font-weight: 700; color: #0A1B33;">{{c.name}}</span>
<span style="font-size: 13px; color: #4A5A70;">{{c.seats}} places</span>
</div>
<div style="font-size: 14px; color: #4A5A70;">{{c.model}} · arrivée dans {{c.eta}}</div>
</div>
<div style="font-size: 20px; font-weight: 800; color: #0A1B33; white-space: nowrap;">{{c.price}}</div>
</button>
</sc-for>

<div style="border: 1px solid #DCE3EC; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: #F4F7FB;">
<div style="display: flex; justify-content: space-between; align-items: center;">
<span style="font-size: 14px; font-weight: 700;">Détail du prix, Neo Premium</span>
<span style="padding: 4px 10px; border-radius: 999px; background: #0B3D91; color: #FFFFFF; font-size: 12px; font-weight: 600;">Modèle garanti</span>
</div>
<sc-for list="{{lines}}" as="l" hint-placeholder-count="5">
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #4A5A70;"><span>{{l.label}}</span><span style="color: #0A1B33;">{{l.value}}</span></div>
</sc-for>
</div>

<button type="button" style="height: 48px; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; padding: 0 4px; text-align: left;">
<div style="width: 40px; height: 28px; border-radius: 6px; background: #0B3D91; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;">VISA</div>
<span style="flex-grow: 1; font-size: 16px; font-weight: 600; color: #0A1B33;">Visa •••• 4242</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5A70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</div>

<div style="flex-shrink: 0; padding: 10px 16px 24px 16px; background: #FFFFFF; border-top: 1px solid #EEF2F7; display: flex; gap: 10px;">
<button type="button" style="flex-grow: 1; height: 56px; border: 0; border-radius: 14px; background: #0B3D91; color: #FFFFFF; font-size: 17px; font-weight: 700;">Confirmer Neo Premium · 31,56 $</button>
<button type="button" aria-label="Planifier cette course" style="width: 56px; height: 56px; border: 1.5px solid #0B3D91; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B3D91" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"></path></svg>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
cats: [
{ name: 'Neo Premium', seats: 4, model: 'Tesla Model 3', eta: '4 min', price: '31,56 $', border: '2px solid #0B3D91', bg: '#F4F8FE' },
{ name: 'Neo Prestige', seats: 4, model: 'Tesla Model S', eta: '7 min', price: '38,46 $', border: '1px solid #DCE3EC', bg: '#FFFFFF' },
{ name: 'Neo XL', seats: 6, model: 'Kia EV9', eta: '9 min', price: '41,62 $', border: '1px solid #DCE3EC', bg: '#FFFFFF' }
],
lines: [
{ label: 'Tarif de la course', value: '24,55 $' },
{ label: 'Frais de service', value: '2,00 $' },
{ label: 'Redevance gouvernementale', value: '0,90 $' },
{ label: 'TPS', value: '1,37 $' },
{ label: 'TVQ', value: '2,74 $' }
]
};
}
}
</script>
</body>
</html>
