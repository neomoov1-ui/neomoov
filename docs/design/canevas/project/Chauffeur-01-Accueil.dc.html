<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 15px; font-weight: 700; color: #2C3A4A;">Demain, 5 h 45 · 44,94 $</span>
<span style="font-size: 14px; color: #4A5A70; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">LaSalle vers l'aéroport Montréal-Trudeau</span>

<span style="flex-grow: 1; font-size: 15px; font-weight: 600; color: #7A4B00;">Inspection Neomoov à refaire d'ici 23 jours</span>

<button type="button" style="height: 56px; border: 1.5px solid #2C3A4A; border-radius: 14px; background: #FFFFFF; color: #2C3A4A; font-size: 17px; font-weight: 700;">Passer hors ligne</button>
</div>

<div style="height: 76px; flex-shrink: 0; border-top: 1px solid #DCE3EC; background: #FFFFFF; display: flex; align-items: stretch; padding: 0 6px; margin-top: 10px;">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button type="button" style="flex: 1 1 0; min-width: 0; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.color}};">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span style="font-size: 12px; font-weight: {{t.weight}};">{{t.label}}</span>

</sc-for>

</div>
