<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>Chauffeur, courses planifiées</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#F4F7FB;color:#0A1B33}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F7FB; color: #0A1B33; overflow: hidden;">

<div style="background: #FFFFFF; padding: 60px 20px 12px 20px; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid #DCE3EC;">
<div style="font-size: 32px; font-weight: 800; letter-spacing: -0.6px;">Courses planifiées</div>
<div style="display: flex; gap: 8px;">
<button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #0A1B33; color: #FFFFFF; font-size: 14px; font-weight: 700;">Disponibles · 6</button>
<button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #DCE3EC; border-radius: 999px; background: #FFFFFF; color: #0A1B33; font-size: 14px; font-weight: 600;">Mes réservations · 2</button>
</div>
<div style="display: flex; gap: 4px;">
<sc-for list="{{week}}" as="d" hint-placeholder-count="7">
<button type="button" style="flex: 1 1 0; height: 56px; border: 0; border-bottom: {{d.rule}}; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: {{d.color}};">
<span style="font-size: 12px; font-weight: 600;">{{d.day}}</span>
<span style="font-size: 17px; font-weight: {{d.weight}};">{{d.num}}</span>
</button>
</sc-for>
</div>
</div>

<div style="flex-grow: 1; padding: 14px 16px 0 16px; display: flex; flex-direction: column; gap: 12px;">

<div style="border-radius: 14px; background: #E4EEFB; padding: 12px 14px; font-size: 14px; line-height: 1.45; color: #0B3D91;">Soyez en ligne 30 minutes avant. Annulation sans effet jusqu'à 60 minutes avant. 5 minutes d'attente comprises.</div>

<sc-for list="{{rides}}" as="r" hint-placeholder-count="3">
<div style="background: #FFFFFF; border: 1px solid #DCE3EC; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; justify-content: space-between; align-items: center;">
<span style="font-size: 15px; font-weight: 600; color: #4A5A70;">{{r.time}}</span>
<span style="padding: 5px 10px; border-radius: 999px; background: {{r.pillBg}}; color: {{r.pillColor}}; font-size: 13px; font-weight: 600;">{{r.pill}}</span>
</div>
<div style="display: flex; align-items: baseline; gap: 10px;">
<span style="font-size: 26px; font-weight: 800; letter-spacing: -0.5px;">{{r.price}}</span>
<span style="font-size: 14px; color: #4A5A70;">{{r.meta}}</span>
</div>
<div style="font-size: 15px; color: #0A1B33;">{{r.route}}</div>
<div style="display: flex; gap: 8px;">
<button type="button" style="flex-grow: 1; height: 48px; border: 0; border-radius: 12px; background: {{r.ctaBg}}; color: {{r.ctaColor}}; font-size: 15px; font-weight: 700;">{{r.cta}}</button>
<button type="button" style="height: 48px; padding: 0 18px; border: 1px solid #DCE3EC; border-radius: 12px; background: #FFFFFF; color: #0A1B33; font-size: 15px; font-weight: 600;">Détails</button>
</div>
</div>
</sc-for>
</div>

<div style="height: 76px; flex-shrink: 0; border-top: 1px solid #DCE3EC; background: #FFFFFF; display: flex; align-items: stretch; padding: 0 6px;">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button type="button" style="flex: 1 1 0; min-width: 0; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.color}};">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span style="font-size: 12px; font-weight: {{t.weight}};">{{t.label}}</span>
</button>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var on = '#0B3D91', off = '#4A5A70';
var days = [['LUN', 21], ['MAR', 22], ['MER', 23], ['JEU', 24], ['VEN', 25], ['SAM', 26], ['DIM', 27]];
return {
week: days.map(function (d) { var sel = d[1] === 22; return { day: d[0], num: d[1], color: sel ? on : off, weight: sel ? 800 : 600, rule: sel ? '3px solid #0B3D91' : '3px solid transparent' }; }),
rides: [
{ time: '5 h 45', pill: 'Forfait aéroport', pillBg: '#E4EEFB', pillColor: '#0B3D91', price: '44,94 $', meta: 'Neo Premium · 11 km · 13 min', route: 'LaSalle vers l’aéroport Montréal-Trudeau (YUL)', cta: 'Réserver cette course', ctaBg: '#0B3D91', ctaColor: '#FFFFFF' },
{ time: '7 h 30', pill: 'Nouveau', pillBg: '#E3F6EA', pillColor: '#14602F', price: '62,31 $', meta: 'Neo XL · 18,7 km · 26 min', route: 'Anjou vers Outremont', cta: 'Réserver cette course', ctaBg: '#0B3D91', ctaColor: '#FFFFFF' }
],
tabs: [
{ label: 'Accueil', color: off, weight: 500, icon: 'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z' },
{ label: 'Planifiées', color: on, weight: 700, icon: 'M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z' },
{ label: 'Revenus', color: off, weight: 500, icon: 'M3 7h18v12H3zM3 11h18M16 15h2' },
{ label: 'Messages', color: off, weight: 500, icon: 'M4 5h16v11H9l-5 4z' },
{ label: 'Menu', color: off, weight: 500, icon: 'M4 7h16M4 12h16M4 17h16' }
]
};
}
}
</script>
</body>
</html>
