<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>Chauffeur, offre de course</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;1,800&amp;family=Nunito:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Nunito,"Segoe UI",system-ui,sans-serif;background:#10171F;color:#2C3A4A}
button{font-family:inherit}
[style*="font-weight: 800"],[style*="font-weight: 700"],h1,h2{font-family:Montserrat,"Segoe UI",system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #10171F; color: #2C3A4A; overflow: hidden;">

<div style="position: relative; height: 268px; flex-shrink: 0;">
<svg viewBox="0 0 390 268" width="390" height="268" aria-hidden="true" style="display: block;">
<rect width="390" height="268" fill="#1B2633"></rect>
<g stroke="#2F3E50" stroke-width="10" stroke-linecap="round" fill="none">
<path d="M-10 90 H400"></path><path d="M-10 200 H400"></path><path d="M90 -10 V280"></path><path d="M230 -10 V280"></path><path d="M330 -10 V280"></path>
</g>
<path d="M90 200 H230 V90 H330" stroke="#5FA8EE" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"></path>
<path d="M40 235 L90 200" stroke="#AAB6C4" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="2 9"></path>
<circle cx="40" cy="235" r="10" fill="#F3F6F9" stroke="#1B2633" stroke-width="3"></circle>
<circle cx="90" cy="200" r="9" fill="#6CC04A" stroke="#1B2633" stroke-width="3"></circle>
<rect x="321" y="81" width="18" height="18" rx="4" fill="#E5484D" stroke="#1B2633" stroke-width="3"></rect>
</svg>
<div style="position: absolute; left: 50%; top: 60px; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px; background: #F3F6F9; color: #2C3A4A; font-size: 15px; font-weight: 700; white-space: nowrap;">Nouvelle course · 12 s</div>
</div>

<div style="flex-grow: 1; margin-top: -22px; border-radius: 24px 24px 0 0; background: #FFFFFF; padding: 20px 20px 24px 20px; display: flex; flex-direction: column; gap: 14px; position: relative;">

<div style="display: flex; justify-content: space-between; align-items: center;">
<span style="padding: 6px 12px; border-radius: 999px; background: #2C3A4A; color: #FFFFFF; font-size: 14px; font-weight: 700;">Neo Premium</span>
<div style="display: flex; gap: 8px; align-items: center;">
<span style="display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; background: #F4F7FB; font-size: 14px; font-weight: 600;">
<svg width="14" height="14" viewBox="0 0 24 24" fill="#0B5FB5" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>
4,92
</span>
<span style="padding: 6px 10px; border-radius: 999px; background: #EAF6E1; color: #2F6B14; font-size: 14px; font-weight: 600;">Client fidèle</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 52px; font-weight: 800; letter-spacing: -1.5px; line-height: 1;">24,55 $</div>
<div style="font-size: 15px; color: #2F6B14; font-weight: 600;">Pour vous en entier. Commission Neomoov : 0 $.</div>
</div>

<div style="display: flex; gap: 14px;">
<div style="display: flex; flex-direction: column; align-items: center; padding-top: 6px; gap: 4px;">
<span style="width: 12px; height: 12px; border-radius: 6px; background: #6CC04A;"></span>
<span style="width: 2px; flex-grow: 1; background: #DCE3EC;"></span>
<span style="width: 12px; height: 12px; border-radius: 3px; background: #C62828;"></span>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 17px; font-weight: 700;">À 4 min (1,6 km)</span>
<span style="font-size: 15px; color: #4A5A70;">Rue Sherbrooke Ouest, Montréal</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 17px; font-weight: 700;">Course de 18 min (8 km)</span>
<span style="font-size: 15px; color: #4A5A70;">Avenue du Parc, Montréal</span>
</div>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<span style="padding: 7px 12px; border-radius: 999px; background: #F4F7FB; border: 1px solid #DCE3EC; font-size: 14px; font-weight: 500; color: #2C3A4A;">{{c}}</span>
</sc-for>
</div>

<div style="flex-grow: 1;"></div>

<div style="display: flex; gap: 10px;">
<button type="button" style="width: 116px; height: 64px; border: 1.5px solid #DCE3EC; border-radius: 16px; background: #FFFFFF; color: #2C3A4A; font-size: 16px; font-weight: 700;">Décliner</button>
<button type="button" style="position: relative; flex-grow: 1; height: 64px; border: 0; border-radius: 16px; background: #1485E0; color: #FFFFFF; font-size: 20px; font-weight: 800; overflow: hidden; padding: 0;">
<span style="position: absolute; left: 0; top: 0; bottom: 0; width: 80%; background: #0B5FB5;"></span>
<span style="position: relative;">Accepter</span>
</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { chips: ['Carte dans l’application', 'Trajet calme', '21 °C', '1 course du Pack Élite'] };
}
}
</script>
</body>
</html>
