# Publication des images Docker sur GHCR (ghcr.io/neomoov1-ui/neomoov-api, -worker, -web) à chaque poussée sur main.
# Le serveur peut alors déployer sans construire : infra/deploy.sh pull <sha> (voir docs/runbooks/deploiement-lws.md).
name: Images

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    steps:
      - name: Code
        uses: actions/checkout@v5

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/neomoov-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/neomoov-${{ matrix.app }}:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.neomoov.net
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
