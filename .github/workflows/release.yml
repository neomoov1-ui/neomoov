# Publication d'une version étiquetée (vX.Y.Z ou vX.Y.Z-beta.N) : notes de version générées depuis les demandes de
# fusion et les commits, puis builds EAS des deux applications si le jeton Expo existe (secret EXPO_TOKEN), soumis aux
# magasins seulement si la variable EAS_AUTO_SUBMIT vaut « oui » (comptes Apple et Google prêts). Les versions natives
# sont gérées par EAS (appVersionSource remote, autoIncrement) ; le JavaScript seul passe par les mises à jour à la volée.
name: Publication

on:
  push:
    tags: ["v*"]

# Aucun droit par défaut (revue du 2 octobre 2026, constat web 17) : chaque tâche reçoit seulement ce qu'il lui faut.
permissions: {}

jobs:
  notes:
    name: Notes de version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --generate-notes $prerelease --title "Neomoov $TAG"

  mobile:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: notes
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [mobile-client, mobile-driver]
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Jeton Expo
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "EXPO_TOKEN absent : builds EAS non lancés (docs/operations/acces-a-fournir.md)"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: Code
        if: steps.token.outputs.skip != '1'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: pnpm
        if: steps.token.outputs.skip != '1'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Node
        if: steps.token.outputs.skip != '1'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Dépendances
        if: steps.token.outputs.skip != '1'
        run: pnpm install --frozen-lockfile
      - name: Build EAS (production)
        if: steps.token.outputs.skip != '1'
        working-directory: apps/${{ matrix.app }}
        env:
          AUTO_SUBMIT: ${{ vars.EAS_AUTO_SUBMIT }}
          # Projet EAS de l'application (variables du dépôt, pas des secrets) : lu par app.config.ts (projet lié, adresse
          # des mises à jour à la volée). Absent : build sans mises à jour à la volée ni notifications push.
          EAS_PROJECT_ID: ${{ matrix.app == 'mobile-client' && vars.EAS_PROJECT_ID_CLIENT || vars.EAS_PROJECT_ID_DRIVER }}
        run: |
          submit=""
          [ "$AUTO_SUBMIT" = "oui" ] && submit="--auto-submit"
          # Version d'EAS fixée (constat web 17) : une nouvelle version ne change pas le build sans revue ; à monter à la main.
          npx --yes eas-cli@24.10.0 build --platform all --profile production --non-interactive --no-wait $submit
